<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#073b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>E-Yasin & Doa Ziarah Keluarga</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
:root{
  --green-900:#06281d; --green-800:#073b2b; --green-700:#0b4d38; --green-600:#0f5a43;
  --green-100:#d9f2e4; --green-50:#eefaf3;
  --gold:#f5b400; --gold-soft:#fff6d6; --gold-line:#e8cf7c;
  --bg:#f2f3ef; --card:#ffffff; --line:#e4e6df; --ink:#14221c; --muted:#5e6b63;
  --arsize:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.5;padding-bottom:84px}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}

/* HEADER */
header.top{position:sticky;top:0;z-index:30;background:var(--green-800);color:#fff;
  padding:max(10px,env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:#0f2a4a;overflow:hidden;display:block;flex:0 0 auto}
.logo img{width:100%;height:100%;display:block}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fontctl{display:flex;align-items:center;gap:2px;background:var(--green-600);border-radius:999px;padding:3px 4px;flex:0 0 auto}
.fontctl button{background:transparent;border:0;color:var(--gold);font-weight:800;font-size:14px;min-width:34px;height:30px;border-radius:999px;cursor:pointer}
.fontctl button:active{background:rgba(255,255,255,.12)}
.fontctl span{font-size:12px;opacity:.85;padding:0 2px}

/* TOP TABS */
.tabs{position:sticky;top:54px;z-index:25;background:var(--green-800);border-bottom:3px solid var(--gold);
  display:flex;gap:8px;overflow-x:auto;padding:6px 12px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:0;background:transparent;color:#e8f5ee;
  font-size:14px;font-weight:600;padding:8px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button svg{width:16px;height:16px}
.tabs button.on{background:var(--gold);color:var(--green-900);font-weight:800}

/* CONTENT */
main{padding:14px 14px 20px}
section.page{display:none;flex-direction:column;gap:14px}
section.page.on{display:flex}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 1px 2px rgba(10,40,28,.05)}
.hero{background:var(--green-800);color:#fff;border-radius:18px;padding:16px;border-left:5px solid var(--gold)}
.hero h2{margin:0 0 2px;font-size:18px;display:flex;align-items:center;gap:8px}
.hero p{margin:0;font-size:13px;opacity:.88}
.hero svg{width:22px;height:22px;color:var(--gold)}
.gold-note{background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:18px;padding:16px}
.step-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.badge{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--green-100);color:var(--green-800);
  display:grid;place-items:center;font-weight:800;font-size:14px;border:1px solid #bfe3cf}
.step-head h3{margin:0;font-size:16px;color:var(--green-700);line-height:1.25}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--gold-soft);color:#7a5a00;border:1px solid var(--gold-line)}
.sub{margin:0 0 10px;font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}

/* ITEM (Arab / Latin / Arti) */
.item{background:#fafaf7;border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px;margin-top:10px}
.item:first-of-type{margin-top:0}
.ar{font-family:"Amiri","Scheherazade New","Noto Naskh Arabic","Noto Sans Arabic","Traditional Arabic","Geeza Pro","Droid Arabic Naskh","Segoe UI",serif;
  direction:rtl;text-align:right;font-size:var(--arsize);line-height:1.95;margin:0;color:#14261d;font-weight:400;
  text-rendering:optimizeLegibility;font-kerning:normal}
.ar.q{font-family:"Amiri Quran","Amiri","Scheherazade New","Noto Naskh Arabic","Geeza Pro",serif}
.ar .mk{color:#b8860b;font-size:.8em;margin:0 3px;white-space:nowrap}
.ar bdi.nm{direction:ltr;unicode-bidi:isolate;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:.62em;font-weight:700;color:#8a6200;padding:0 4px}
.lat{margin:6px 0 0;font-style:italic;color:#46544b;font-size:14px;line-height:1.55}
.arti{margin:6px 0 0;color:#5a6860;font-size:14px;line-height:1.55}
.arti b{color:#33423a}
.tag{font-size:12px;font-weight:700;color:var(--green-700);margin:0 0 4px;display:block}

/* YASIN */
.ayat .num{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ayat .num .badge{width:34px;height:34px}
.ayat .num small{color:#7b867f;font-size:12px}
.bismillah{text-align:center;background:var(--green-50);border-color:#c8e8d6}
.bismillah .ar{text-align:center}

/* BUTTONS */
.next{width:100%;border:0;background:var(--green-600);color:#fff;font-weight:800;font-size:15px;padding:15px 16px;border-radius:14px;cursor:pointer;margin-top:4px;box-shadow:0 3px 10px rgba(11,77,56,.25)}
.next:active{transform:scale(.99);background:var(--green-700)}
.next.sm{width:auto;padding:10px 16px;font-size:14px;margin-top:10px}
.ghost{border:1px solid #c8d8cf;background:#fff;color:var(--green-700);font-weight:700;border-radius:12px;padding:10px 14px;cursor:pointer;font-size:14px}
details.fat{margin-top:12px;border:1px dashed #b9d2c4;border-radius:12px;background:#f6fbf8}
details.fat summary{cursor:pointer;padding:11px 12px;font-weight:800;color:var(--green-700);text-align:center;list-style:none;font-size:14px}
details.fat summary::-webkit-details-marker{display:none}
details.fat summary:before{content:"▸ "}
details.fat[open] summary:before{content:"▾ "}
details.fat .inner{padding:0 10px 10px}
details.adab{background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:18px;padding:0}
details.adab summary{cursor:pointer;padding:13px 16px;font-weight:800;color:#7a5a00;list-style:none;font-size:14px}
details.adab summary::-webkit-details-marker{display:none}
details.adab summary:before{content:"▸ "}
details.adab[open] summary:before{content:"▾ "}
details.adab .in{padding:0 16px 14px}

/* LISTS */
ul.ad{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
ul.ad li::marker{color:var(--green-600)}

/* SILSILAH */
.cover{background:linear-gradient(180deg,#0f4a37,#06281d);color:#fff;border-radius:22px;padding:18px;text-align:center;border:1px solid #c9a23a}
.cover .chip{display:inline-block;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:800;color:var(--gold);border:1px solid rgba(245,180,0,.45);padding:5px 12px;border-radius:999px;background:rgba(0,0,0,.2)}
.cover .photos{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:14px 0 6px}
.avatar{width:82px;height:82px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#f9dc7a,#b88a1a);display:grid}
.avatar>div{border-radius:50%;background:#0b3a2b;overflow:hidden;display:grid;place-items:center;color:var(--gold)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar svg{width:34px;height:34px}
.cover .who{font-size:12px;font-weight:700;color:#ffe7a3;margin-top:5px}
.cover h2{margin:2px 0 0;font-size:17px}
.cover .meta{font-size:12px;color:#b9dcc9}
.cover .small{font-size:12.5px;color:#a9d3bd;font-style:italic;margin:8px 0 0}
.fam{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px}
.fam .avatar{width:50px;height:50px;padding:2px;flex:0 0 auto}
.fam .avatar svg{width:22px;height:22px}
.fam .rel{display:flex;justify-content:space-between;gap:6px;align-items:center}
.fam .rel b{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--green-600)}
.fam .rel i{font-style:normal;font-size:11px;background:var(--green-100);color:var(--green-800);padding:2px 8px;border-radius:999px;font-weight:700}
.fam h4{margin:2px 0;font-size:15px}
.fam .det{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.fam .kenang{font-size:12px;color:#7a6b2a;font-style:italic;margin-top:3px}
.fam.hidup{background:#fbfbf8}
.count{background:var(--green-100);color:var(--green-800);font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.row h3{margin:0;font-size:16px;color:var(--green-700)}
.stat{font-size:12px;color:var(--muted)}

/* TASBIH */
.tasbih{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--green-50);border:1px solid #c8e8d6;border-radius:14px;padding:12px;margin-top:10px}
.tasbih .n{font-size:34px;font-weight:900;color:var(--green-700);font-variant-numeric:tabular-nums;min-width:64px}
.tasbih .lbl{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--green-600)}
.tasbih .btns{display:flex;gap:8px}
.tasbih .plus{background:var(--gold);color:var(--green-900);border:0;font-weight:900;border-radius:12px;padding:12px 18px;font-size:15px;cursor:pointer}
.tasbih .plus:active{transform:scale(.96)}

/* BOTTOM NAV */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .in{max-width:520px;width:100%;display:flex}
nav.bottom button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;color:#2b3b33;font-size:11px;font-weight:600;cursor:pointer}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button.on{color:var(--green-600);font-weight:800}
nav.bottom button.on svg{stroke-width:2.6}

.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);justify-content:center;margin-top:2px;text-align:center}
.sync button{border:0;background:transparent;color:var(--green-600);font-weight:700;font-size:12px;cursor:pointer;text-decoration:underline}
/* TUTORIAL PASANG */
#page-pasang{position:relative}
.wm{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden;border-radius:18px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='190'><text x='130' y='95' transform='rotate(-28 130 95)' text-anchor='middle' font-family='Arial,sans-serif' font-size='17' font-weight='700' fill='%23073b2b' fill-opacity='0.13'>Created by Hari Santoso</text></svg>")}
.shot{position:relative;margin:10px auto 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#222}
.shot img,.shot svg.mock{display:block;width:100%;height:auto}
.hl{position:absolute;border:3px solid #ff3b30;border-radius:12px;box-shadow:0 0 0 4px rgba(255,59,48,.28);animation:pulse 1.4s infinite}
.hl-tag{position:absolute;background:#ff3b30;color:#fff;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(255,59,48,.08)}}
.shot .stamp{position:absolute;right:8px;bottom:6px;font-size:11px;font-weight:700;color:rgba(255,255,255,.75);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.sig{text-align:center;font-size:12px;font-weight:700;color:var(--green-700);letter-spacing:.3px;padding:4px 0 2px}
.lb{position:fixed;inset:0;z-index:100;background:rgba(5,15,10,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;touch-action:pinch-zoom}
.lb img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:12px;background:#0b3a2b;min-width:120px;min-height:120px}
.lbx{position:absolute;top:max(12px,env(safe-area-inset-top));right:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:28px;line-height:1;cursor:pointer}
.lbc{text-align:center;color:#fff}.lbc b{display:block;font-size:17px}.lbc span{font-size:13px;color:#ffe7a3}.lbd{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}.lbd div{background:rgba(255,255,255,.12);border-radius:10px;padding:6px 12px;font-size:13px}.lbd small{display:block;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:#ffe7a3}
.inst{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:45;display:none;justify-content:center;padding:0 12px;pointer-events:none}
.inst.on{display:flex}
.inst .box{pointer-events:auto;max-width:496px;width:100%;background:var(--green-800);color:#fff;border:1px solid var(--gold);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.inst img{width:42px;height:42px;border-radius:10px;flex:0 0 auto}
.inst .tx{flex:1;min-width:0;font-size:13px;line-height:1.35}.inst .tx b{display:block;font-size:14px}
.inst button{border:0;border-radius:999px;font-weight:800;font-size:13px;padding:9px 14px;cursor:pointer}
.inst .go{background:var(--gold);color:var(--green-900)}.inst .no{background:transparent;color:#cfe7da;padding:9px 6px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo"><img src="icon.svg" alt="Logo E-Yasin"></div>
      <h1>E-Yasin &amp; Doa Ziarah</h1>
    </div>
    <div class="fontctl" aria-label="Ukuran huruf Arab">
      <button onclick="changeFont(-1)" aria-label="Perkecil huruf">A-</button>
      <span>Font</span>
      <button onclick="changeFont(1)" aria-label="Perbesar huruf">A+</button>
    </div>
  </header>
  <div class="tabs" id="topTabs"></div>

  <main>
    <section class="page" id="page-cover"></section>
    <section class="page" id="page-ziarah"></section>
    <section class="page" id="page-tawasul"></section>
    <section class="page" id="page-yasin"></section>
    <section class="page" id="page-tahlil"></section>
    <section class="page" id="page-doa"></section>
    <section class="page" id="page-pasang"></section>
  </main>
</div>
<div class="inst" id="inst"><div class="box"><img src="icon.svg" alt=""><div class="tx"><b>Pasang E-Yasin di HP</b><span id="instTx">Buka lebih cepat dari layar utama, bisa tanpa internet.</span></div><button class="go" id="instGo">Pasang</button><button class="no" id="instNo">Nanti</button></div></div>
<nav class="bottom"><div class="in" id="bottomNav"></div></nav>

<script>
// Surat Yasin (QS. 36) ayat 1-83: [Arab, Latin, Terjemah Indonesia]
const YASIN = [
["يسٓ","Yaa-Siiin","Yā Sīn. (Huruf-huruf pembuka surah; maknanya hanya Allah yang mengetahui.)"],
["وَٱلْقُرْءَانِ ٱلْحَكِيمِ","Wal-qur-aanil-hakiim","Demi Al-Qur’an yang penuh hikmah,"],
["إِنَّكَ لَمِنَ ٱلْمُرْسَلِينَ","Innaka laminal-mursaliin","sungguh, engkau (Muhammad) benar-benar termasuk para rasul,"],
["عَلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ","'Alaa shiraathim-mustaqiim","(yang berada) di atas jalan yang lurus,"],
["تَنزِيلَ ٱلْعَزِيزِ ٱلرَّحِيمِ","Tanziilal-'aziizir-rahiim","(sebagai wahyu) yang diturunkan oleh Yang Mahaperkasa lagi Maha Penyayang,"],
["لِتُنذِرَ قَوْمًۭا مَّآ أُنذِرَ ءَابَآؤُهُمْ فَهُمْ غَٰفِلُونَ","Litundzira qawmam-maa undzira aabaaa-uhum fahum ghaafiluun","agar engkau memberi peringatan kepada kaum yang nenek moyangnya belum pernah diberi peringatan, karena itu mereka lalai."],
["لَقَدْ حَقَّ ٱلْقَوْلُ عَلَىٰٓ أَكْثَرِهِمْ فَهُمْ لَا يُؤْمِنُونَ","Laqad haqqal-qawlu 'alaa aktsarihim fahum laa yu'minuun","Sungguh, telah pasti berlaku perkataan (azab) terhadap kebanyakan mereka, karena mereka tidak beriman."],
["إِنَّا جَعَلْنَا فِىٓ أَعْنَٰقِهِمْ أَغْلَٰلًۭا فَهِىَ إِلَى ٱلْأَذْقَانِ فَهُم مُّقْمَحُونَ","Innaa ja'alnaa fiii a'naaqihim aghlaalan fahiya ilal-adzqaani fahum muqmahuun","Sungguh, Kami telah memasang belenggu di leher mereka, lalu tangan mereka (diangkat) ke dagu, maka mereka menengadah."],
["وَجَعَلْنَا مِنۢ بَيْنِ أَيْدِيهِمْ سَدًّۭا وَمِنْ خَلْفِهِمْ سَدًّۭا فَأَغْشَيْنَٰهُمْ فَهُمْ لَا يُبْصِرُونَ","Wa ja'alnaa mim-bayni aydiihim saddaw-wa min khalfihim saddan fa-aghsyaynaahum fahum laa yubshiruun","Dan Kami adakan di hadapan mereka sekat dan di belakang mereka juga sekat, lalu Kami tutup (pandangan) mereka sehingga mereka tidak dapat melihat."],
["وَسَوَآءٌ عَلَيْهِمْ ءَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ لَا يُؤْمِنُونَ","Wa sawaaa-un 'alayhim a-andzartahum am lam tundzirhum laa yu'minuun","Sama saja bagi mereka, engkau beri peringatan atau tidak engkau beri peringatan, mereka tidak akan beriman."],
["إِنَّمَا تُنذِرُ مَنِ ٱتَّبَعَ ٱلذِّكْرَ وَخَشِىَ ٱلرَّحْمَٰنَ بِٱلْغَيْبِ ۖ فَبَشِّرْهُ بِمَغْفِرَةٍۢ وَأَجْرٍۢ كَرِيمٍ","Innamaa tundziru manittaba'adz-dzikra wa khasyiyar-rahmaana bil-ghayb, fabasysyirhu bimaghfiratiw-wa ajrin kariim","Sesungguhnya engkau hanya memberi peringatan kepada orang yang mau mengikuti peringatan dan takut kepada Allah Yang Maha Pengasih walaupun dia tidak melihat-Nya. Maka berilah dia kabar gembira dengan ampunan dan pahala yang mulia."],
["إِنَّا نَحْنُ نُحْىِ ٱلْمَوْتَىٰ وَنَكْتُبُ مَا قَدَّمُوا۟ وَءَاثَٰرَهُمْ ۚ وَكُلَّ شَىْءٍ أَحْصَيْنَٰهُ فِىٓ إِمَامٍۢ مُّبِينٍۢ","Innaa nahnu nuhyil-mawtaa wa naktubu maa qaddamuu wa aatsaarahum, wa kulla syay-in ahsaynaahu fiii imaamim-mubiin","Sungguh, Kamilah yang menghidupkan orang-orang mati, dan Kami mencatat apa yang telah mereka kerjakan dan bekas-bekas (amal) yang mereka tinggalkan. Dan segala sesuatu Kami kumpulkan dalam kitab induk yang nyata (Lauh Mahfuz)."],
["وَٱضْرِبْ لَهُم مَّثَلًا أَصْحَٰبَ ٱلْقَرْيَةِ إِذْ جَآءَهَا ٱلْمُرْسَلُونَ","Wadhrib lahum matsalan ash-haabal-qaryati idz jaaa-ahal-mursaluun","Dan buatkanlah bagi mereka suatu perumpamaan, yaitu penduduk suatu negeri ketika utusan-utusan datang kepada mereka."],
["إِذْ أَرْسَلْنَآ إِلَيْهِمُ ٱثْنَيْنِ فَكَذَّبُوهُمَا فَعَزَّزْنَا بِثَالِثٍۢ فَقَالُوٓا۟ إِنَّآ إِلَيْكُم مُّرْسَلُونَ","Idz arsalnaaa ilayhimuts-nayni fakadz-dzabuuhumaa fa'azzaznaa bitsaalitsin faqaaluuu innaaa ilaykum mursaluun","(Yaitu) ketika Kami mengutus kepada mereka dua orang utusan, lalu mereka mendustakan keduanya; kemudian Kami kuatkan dengan (utusan) yang ketiga; maka ketiganya berkata, “Sungguh, kami adalah utusan-utusan kepadamu.”"],
["قَالُوا۟ مَآ أَنتُمْ إِلَّا بَشَرٌۭ مِّثْلُنَا وَمَآ أَنزَلَ ٱلرَّحْمَٰنُ مِن شَىْءٍ إِنْ أَنتُمْ إِلَّا تَكْذِبُونَ","Qaaluu maaa antum illaa basyarum-mitslunaa wa maaa anzalar-rahmaanu min syay-in in antum illaa takdzibuun","Mereka menjawab, “Kamu hanyalah manusia seperti kami, dan (Allah) Yang Maha Pengasih tidak menurunkan sesuatu apa pun; kamu hanya berdusta belaka.”"],
["قَالُوا۟ رَبُّنَا يَعْلَمُ إِنَّآ إِلَيْكُمْ لَمُرْسَلُونَ","Qaaluu rabbunaa ya'lamu innaaa ilaykum lamursaluun","Mereka (para utusan) berkata, “Tuhan kami mengetahui bahwa sungguh kami adalah utusan-utusan kepadamu."],
["وَمَا عَلَيْنَآ إِلَّا ٱلْبَلَٰغُ ٱلْمُبِينُ","Wa maa 'alaynaaa illal-balaaghul-mubiin","Dan kewajiban kami hanyalah menyampaikan (perintah Allah) dengan jelas.”"],
["قَالُوٓا۟ إِنَّا تَطَيَّرْنَا بِكُمْ ۖ لَئِن لَّمْ تَنتَهُوا۟ لَنَرْجُمَنَّكُمْ وَلَيَمَسَّنَّكُم مِّنَّا عَذَابٌ أَلِيمٌۭ","Qaaluuu innaa tathayyarnaa bikum, la-il-lam tantahuu lanarjumannakum wa layamassannakum minnaa 'adzaabun aliim","Mereka menjawab, “Sungguh, kami bernasib malang karena kamu. Jika kamu tidak berhenti, niscaya kami akan merajam kamu dan kamu pasti akan merasakan siksaan yang pedih dari kami.”"],
["قَالُوا۟ طَٰٓئِرُكُم مَّعَكُمْ ۚ أَئِن ذُكِّرْتُم ۚ بَلْ أَنتُمْ قَوْمٌۭ مُّسْرِفُونَ","Qaaluu thaaa-irukum ma'akum, a-in dzukkirtum, bal antum qawmum-musrifuun","Mereka (para utusan) berkata, “Nasib malangmu itu adalah karena kamu sendiri. Apakah karena kamu diberi peringatan? Sungguh, kamu kaum yang melampaui batas.”"],
["وَجَآءَ مِنْ أَقْصَا ٱلْمَدِينَةِ رَجُلٌۭ يَسْعَىٰ قَالَ يَٰقَوْمِ ٱتَّبِعُوا۟ ٱلْمُرْسَلِينَ","Wa jaaa-a min aqshal-madiinati rajuluy-yas'aa qaala yaa qawmittabi'ul-mursaliin","Dan datanglah dari ujung kota seorang laki-laki dengan bergegas-gegas, dia berkata, “Wahai kaumku! Ikutilah utusan-utusan itu."],
["ٱتَّبِعُوا۟ مَن لَّا يَسْـَٔلُكُمْ أَجْرًۭا وَهُمْ مُّهْتَدُونَ","Ittabi'uu mal-laa yas-alukum ajraw-wahum muhtaduun","Ikutilah orang yang tidak meminta imbalan kepadamu, dan mereka adalah orang-orang yang mendapat petunjuk."],
["وَمَا لِىَ لَآ أَعْبُدُ ٱلَّذِى فَطَرَنِى وَإِلَيْهِ تُرْجَعُونَ","Wa maa liya laaa a'budulladzii fatharanii wa ilayhi turja'uun","Dan mengapa aku tidak menyembah (Allah) yang telah menciptakanku dan hanya kepada-Nyalah kamu (semua) akan dikembalikan?"],
["ءَأَتَّخِذُ مِن دُونِهِۦٓ ءَالِهَةً إِن يُرِدْنِ ٱلرَّحْمَٰنُ بِضُرٍّۢ لَّا تُغْنِ عَنِّى شَفَٰعَتُهُمْ شَيْـًۭٔا وَلَا يُنقِذُونِ","A-attakhidzu min duunihiii aalihatan iy-yuridnir-rahmaanu bidhurril-laa tughni 'annii syafaa'atuhum syay-aw-wa laa yunqidzuun","Mengapa aku akan menyembah tuhan-tuhan selain-Nya? Jika (Allah) Yang Maha Pengasih menghendaki bencana terhadapku, pasti pertolongan mereka tidak berguna sedikit pun bagiku dan mereka tidak (pula) dapat menyelamatkanku."],
["إِنِّىٓ إِذًۭا لَّفِى ضَلَٰلٍۢ مُّبِينٍ","Inniii idzal-lafii dhalaalim-mubiin","Sungguh, jika demikian aku benar-benar berada dalam kesesatan yang nyata."],
["إِنِّىٓ ءَامَنتُ بِرَبِّكُمْ فَٱسْمَعُونِ","Inniii aamantu birabbikum fasma'uun","Sungguh, aku telah beriman kepada Tuhanmu, maka dengarkanlah (pengakuan imanku)."],
["قِيلَ ٱدْخُلِ ٱلْجَنَّةَ ۖ قَالَ يَٰلَيْتَ قَوْمِى يَعْلَمُونَ","Qiiladkhulil-jannah, qaala yaa layta qawmii ya'lamuun","Dikatakan (kepadanya), “Masuklah ke surga.” Dia berkata, “Alangkah baiknya sekiranya kaumku mengetahui,"],
["بِمَا غَفَرَ لِى رَبِّى وَجَعَلَنِى مِنَ ٱلْمُكْرَمِينَ","Bimaa ghafara lii rabbii wa ja'alanii minal-mukramiin","bahwa Tuhanku telah memberi ampun kepadaku dan menjadikan aku termasuk orang-orang yang dimuliakan.”"],
["وَمَآ أَنزَلْنَا عَلَىٰ قَوْمِهِۦ مِنۢ بَعْدِهِۦ مِن جُندٍۢ مِّنَ ٱلسَّمَآءِ وَمَا كُنَّا مُنزِلِينَ","Wa maaa anzalnaa 'alaa qawmihii mim-ba'dihii min jundim-minas-samaaa-i wa maa kunnaa munziliin","Dan setelah dia (wafat), Kami tidak menurunkan suatu pasukan pun dari langit kepada kaumnya, dan tidak perlu Kami menurunkannya."],
["إِن كَانَتْ إِلَّا صَيْحَةًۭ وَٰحِدَةًۭ فَإِذَا هُمْ خَٰمِدُونَ","In kaanat illaa shayhataw-waahidatan fa-idzaa hum khaamiduun","Tidak ada (siksaan atas mereka) melainkan satu teriakan saja; maka seketika itu mereka semuanya mati."],
["يَٰحَسْرَةً عَلَى ٱلْعِبَادِ ۚ مَا يَأْتِيهِم مِّن رَّسُولٍ إِلَّا كَانُوا۟ بِهِۦ يَسْتَهْزِءُونَ","Yaa hasratan 'alal-'ibaad, maa ya'tiihim mir-rasuulin illaa kaanuu bihii yastahzi-uun","Alangkah besar penyesalan terhadap hamba-hamba itu; setiap datang seorang rasul kepada mereka, mereka selalu memperolok-olokkannya."],
["أَلَمْ يَرَوْا۟ كَمْ أَهْلَكْنَا قَبْلَهُم مِّنَ ٱلْقُرُونِ أَنَّهُمْ إِلَيْهِمْ لَا يَرْجِعُونَ","Alam yaraw kam ahlaknaa qablahum minal-quruuni annahum ilayhim laa yarji'uun","Tidakkah mereka memperhatikan berapa banyak umat sebelum mereka yang telah Kami binasakan, bahwa (generasi) yang telah binasa itu tidak akan kembali kepada mereka?"],
["وَإِن كُلٌّۭ لَّمَّا جَمِيعٌۭ لَّدَيْنَا مُحْضَرُونَ","Wa in kullul-lammaa jamii'ul-ladaynaa muhdharuun","Dan semuanya, tidak terkecuali, akan dihadapkan kepada Kami."],
["وَءَايَةٌۭ لَّهُمُ ٱلْأَرْضُ ٱلْمَيْتَةُ أَحْيَيْنَٰهَا وَأَخْرَجْنَا مِنْهَا حَبًّۭا فَمِنْهُ يَأْكُلُونَ","Wa aayatul-lahumul-ardhul-maytatu ahyaynaahaa wa akhrajnaa minhaa habban faminhu ya'kuluun","Dan suatu tanda (kebesaran Allah) bagi mereka adalah bumi yang mati. Kami hidupkan bumi itu dan Kami keluarkan darinya biji-bijian, maka dari (biji-bijian) itu mereka makan."],
["وَجَعَلْنَا فِيهَا جَنَّٰتٍۢ مِّن نَّخِيلٍۢ وَأَعْنَٰبٍۢ وَفَجَّرْنَا فِيهَا مِنَ ٱلْعُيُونِ","Wa ja'alnaa fiihaa jannaatim-min nakhiiliw-wa a'naabiw-wa fajjarnaa fiihaa minal-'uyuun","Dan Kami jadikan padanya kebun-kebun kurma dan anggur, dan Kami pancarkan padanya beberapa mata air,"],
["لِيَأْكُلُوا۟ مِن ثَمَرِهِۦ وَمَا عَمِلَتْهُ أَيْدِيهِمْ ۖ أَفَلَا يَشْكُرُونَ","Liya'kuluu min tsamarihii wa maa 'amilat-hu aydiihim, afalaa yasykuruun","agar mereka dapat makan dari buahnya, dan dari hasil usaha tangan mereka. Maka mengapa mereka tidak bersyukur?"],
["سُبْحَٰنَ ٱلَّذِى خَلَقَ ٱلْأَزْوَٰجَ كُلَّهَا مِمَّا تُنۢبِتُ ٱلْأَرْضُ وَمِنْ أَنفُسِهِمْ وَمِمَّا لَا يَعْلَمُونَ","Subhaanalladzii khalaqal-azwaaja kullahaa mimmaa tumbitul-ardhu wa min anfusihim wa mimmaa laa ya'lamuun","Mahasuci (Allah) yang telah menciptakan semuanya berpasang-pasangan, baik dari apa yang ditumbuhkan oleh bumi dan dari diri mereka sendiri, maupun dari apa yang tidak mereka ketahui."],
["وَءَايَةٌۭ لَّهُمُ ٱلَّيْلُ نَسْلَخُ مِنْهُ ٱلنَّهَارَ فَإِذَا هُم مُّظْلِمُونَ","Wa aayatul-lahumul-laylu naslakhu minhun-nahaara fa-idzaa hum muzhlimuun","Dan suatu tanda (kebesaran Allah) bagi mereka adalah malam; Kami tanggalkan siang darinya, maka seketika itu mereka dalam kegelapan."],
["وَٱلشَّمْسُ تَجْرِى لِمُسْتَقَرٍّۢ لَّهَا ۚ ذَٰلِكَ تَقْدِيرُ ٱلْعَزِيزِ ٱلْعَلِيمِ","Wasy-syamsu tajrii limustaqarril-lahaa, dzaalika taqdiirul-'aziizil-'aliim","Dan matahari berjalan di tempat peredarannya. Demikianlah ketetapan (Allah) Yang Mahaperkasa, Maha Mengetahui."],
["وَٱلْقَمَرَ قَدَّرْنَٰهُ مَنَازِلَ حَتَّىٰ عَادَ كَٱلْعُرْجُونِ ٱلْقَدِيمِ","Wal-qamara qaddarnaahu manaazila hattaa 'aada kal-'urjuunil-qadiim","Dan telah Kami tetapkan tempat-tempat bagi bulan, sehingga (setelah sampai ke tempat yang terakhir) kembalilah ia seperti bentuk tandan yang tua."],
["لَا ٱلشَّمْسُ يَنۢبَغِى لَهَآ أَن تُدْرِكَ ٱلْقَمَرَ وَلَا ٱلَّيْلُ سَابِقُ ٱلنَّهَارِ ۚ وَكُلٌّۭ فِى فَلَكٍۢ يَسْبَحُونَ","Lasy-syamsu yambaghii lahaaa an tudrikal-qamara wa lal-laylu saabiqun-nahaar, wa kullun fii falakiy-yasbahuun","Tidaklah mungkin bagi matahari mengejar bulan dan malam pun tidak dapat mendahului siang. Masing-masing beredar pada garis edarnya."],
["وَءَايَةٌۭ لَّهُمْ أَنَّا حَمَلْنَا ذُرِّيَّتَهُمْ فِى ٱلْفُلْكِ ٱلْمَشْحُونِ","Wa aayatul-lahum annaa hamalnaa dzurriyyatahum fil-fulkil-masyhuun","Dan suatu tanda (kebesaran Allah) bagi mereka adalah bahwa Kami angkut keturunan mereka dalam kapal yang penuh muatan,"],
["وَخَلَقْنَا لَهُم مِّن مِّثْلِهِۦ مَا يَرْكَبُونَ","Wa khalaqnaa lahum mim-mitslihii maa yarkabuun","dan Kami ciptakan bagi mereka (angkutan lain) yang serupa dengan itu yang mereka kendarai."],
["وَإِن نَّشَأْ نُغْرِقْهُمْ فَلَا صَرِيخَ لَهُمْ وَلَا هُمْ يُنقَذُونَ","Wa in nasya' nughriqhum falaa shariikha lahum wa laa hum yunqadzuun","Dan jika Kami menghendaki, Kami tenggelamkan mereka, maka tidak ada yang menolong mereka dan tidak (pula) mereka diselamatkan,"],
["إِلَّا رَحْمَةًۭ مِّنَّا وَمَتَٰعًا إِلَىٰ حِينٍۢ","Illaa rahmatam-minnaa wa mataa'an ilaa hiin","kecuali karena rahmat dari Kami dan untuk memberikan kesenangan hidup sampai waktu tertentu."],
["وَإِذَا قِيلَ لَهُمُ ٱتَّقُوا۟ مَا بَيْنَ أَيْدِيكُمْ وَمَا خَلْفَكُمْ لَعَلَّكُمْ تُرْحَمُونَ","Wa idzaa qiila lahumuttaquu maa bayna aydiikum wa maa khalfakum la'allakum turhamuun","Dan apabila dikatakan kepada mereka, “Takutlah kamu akan apa yang di depanmu dan apa yang di belakangmu (azab dunia dan akhirat) agar kamu mendapat rahmat,” (niscaya mereka berpaling)."],
["وَمَا تَأْتِيهِم مِّنْ ءَايَةٍۢ مِّنْ ءَايَٰتِ رَبِّهِمْ إِلَّا كَانُوا۟ عَنْهَا مُعْرِضِينَ","Wa maa ta'tiihim min aayatim-min aayaati rabbihim illaa kaanuu 'anhaa mu'ridhiin","Dan tidak datang kepada mereka suatu tanda dari tanda-tanda (kebesaran) Tuhan mereka, melainkan mereka selalu berpaling darinya."],
["وَإِذَا قِيلَ لَهُمْ أَنفِقُوا۟ مِمَّا رَزَقَكُمُ ٱللَّهُ قَالَ ٱلَّذِينَ كَفَرُوا۟ لِلَّذِينَ ءَامَنُوٓا۟ أَنُطْعِمُ مَن لَّوْ يَشَآءُ ٱللَّهُ أَطْعَمَهُۥٓ إِنْ أَنتُمْ إِلَّا فِى ضَلَٰلٍۢ مُّبِينٍۢ","Wa idzaa qiila lahum anfiquu mimmaa razaqakumullaahu qaalalladziina kafaruu lilladziina aamanuuu anuth'imu mal-law yasyaaa-ullaahu ath'amah, in antum illaa fii dhalaalim-mubiin","Dan apabila dikatakan kepada mereka, “Infakkanlah sebagian rezeki yang diberikan Allah kepadamu,” orang-orang kafir berkata kepada orang-orang beriman, “Apakah kami akan memberi makan orang-orang yang jika Allah menghendaki tentu Dia akan memberinya makan? Kamu benar-benar dalam kesesatan yang nyata.”"],
["وَيَقُولُونَ مَتَىٰ هَٰذَا ٱلْوَعْدُ إِن كُنتُمْ صَٰدِقِينَ","Wa yaquuluuna mataa haadzal-wa'du in kuntum shaadiqiin","Dan mereka berkata, “Kapankah janji (hari berbangkit) ini (terjadi), jika kamu orang yang benar?”"],
["مَا يَنظُرُونَ إِلَّا صَيْحَةًۭ وَٰحِدَةًۭ تَأْخُذُهُمْ وَهُمْ يَخِصِّمُونَ","Maa yanzhuruuna illaa shayhataw-waahidatan ta'khudzuhum wa hum yakhish-shimuun","Mereka hanya menunggu satu teriakan saja yang akan membinasakan mereka ketika mereka sedang bertengkar."],
["فَلَا يَسْتَطِيعُونَ تَوْصِيَةًۭ وَلَآ إِلَىٰٓ أَهْلِهِمْ يَرْجِعُونَ","Falaa yastathii'uuna tawshiyataw-wa laaa ilaaa ahlihim yarji'uun","Maka mereka tidak sempat membuat wasiat dan tidak (pula) dapat kembali kepada keluarganya."],
["وَنُفِخَ فِى ٱلصُّورِ فَإِذَا هُم مِّنَ ٱلْأَجْدَاثِ إِلَىٰ رَبِّهِمْ يَنسِلُونَ","Wa nufikha fish-shuuri fa-idzaa hum minal-ajdaatsi ilaa rabbihim yansiluun","Dan sangkakala pun ditiup, maka seketika itu mereka keluar dari kuburnya (menuju) kepada Tuhan mereka."],
["قَالُوا۟ يَٰوَيْلَنَا مَنۢ بَعَثَنَا مِن مَّرْقَدِنَا ۜ ۗ هَٰذَا مَا وَعَدَ ٱلرَّحْمَٰنُ وَصَدَقَ ٱلْمُرْسَلُونَ","Qaaluu yaa waylanaa mam-ba'atsanaa mim-marqadinaa, haadzaa maa wa'adar-rahmaanu wa shadaqal-mursaluun","Mereka berkata, “Celakalah kami! Siapakah yang membangkitkan kami dari tempat tidur kami (kubur)?” Inilah yang dijanjikan (Allah) Yang Maha Pengasih dan benarlah para rasul(-Nya)."],
["إِن كَانَتْ إِلَّا صَيْحَةًۭ وَٰحِدَةًۭ فَإِذَا هُمْ جَمِيعٌۭ لَّدَيْنَا مُحْضَرُونَ","In kaanat illaa shayhataw-waahidatan fa-idzaa hum jamii'ul-ladaynaa muhdharuun","Tidak ada teriakan itu selain satu teriakan saja, maka seketika itu mereka semua dihadapkan kepada Kami."],
["فَٱلْيَوْمَ لَا تُظْلَمُ نَفْسٌۭ شَيْـًۭٔا وَلَا تُجْزَوْنَ إِلَّا مَا كُنتُمْ تَعْمَلُونَ","Fal-yawma laa tuzhlamu nafsun syay-aw-wa laa tujzawna illaa maa kuntum ta'maluun","Maka pada hari itu tidak seorang pun dirugikan sedikit pun, dan kamu tidak diberi balasan kecuali apa yang telah kamu kerjakan."],
["إِنَّ أَصْحَٰبَ ٱلْجَنَّةِ ٱلْيَوْمَ فِى شُغُلٍۢ فَٰكِهُونَ","Inna ash-haabal-jannatil-yawma fii syughulin faakihuun","Sungguh, penghuni surga pada hari itu bersenang-senang dalam kesibukan (mereka)."],
["هُمْ وَأَزْوَٰجُهُمْ فِى ظِلَٰلٍ عَلَى ٱلْأَرَآئِكِ مُتَّكِـُٔونَ","Hum wa azwaajuhum fii zhilaalin 'alal-araaa-iki muttaki-uun","Mereka dan pasangan-pasangan mereka berada dalam naungan, bersandar di atas dipan-dipan."],
["لَهُمْ فِيهَا فَٰكِهَةٌۭ وَلَهُم مَّا يَدَّعُونَ","Lahum fiihaa faakihatuw-wa lahum maa yadda'uun","Di surga itu mereka memperoleh buah-buahan dan memperoleh apa saja yang mereka minta."],
["سَلَٰمٌۭ قَوْلًۭا مِّن رَّبٍّۢ رَّحِيمٍۢ","Salaamun qawlam-mir-rabbir-rahiim","(Kepada mereka dikatakan), “Salam,” sebagai ucapan selamat dari Tuhan Yang Maha Penyayang."],
["وَٱمْتَٰزُوا۟ ٱلْيَوْمَ أَيُّهَا ٱلْمُجْرِمُونَ","Wamtaazul-yawma ayyuhal-mujrimuun","(Dan dikatakan kepada orang-orang durhaka), “Berpisahlah kamu (dari orang-orang mukmin) pada hari ini, wahai para pendurhaka!"],
["أَلَمْ أَعْهَدْ إِلَيْكُمْ يَٰبَنِىٓ ءَادَمَ أَن لَّا تَعْبُدُوا۟ ٱلشَّيْطَٰنَ ۖ إِنَّهُۥ لَكُمْ عَدُوٌّۭ مُّبِينٌۭ","Alam a'had ilaykum yaa baniii aadama al-laa ta'budusy-syaythaan, innahuu lakum 'aduwwum-mubiin","Bukankah Aku telah memerintahkan kepadamu wahai anak cucu Adam agar kamu tidak menyembah setan? Sungguh, setan itu musuh yang nyata bagimu,"],
["وَأَنِ ٱعْبُدُونِى ۚ هَٰذَا صِرَٰطٌۭ مُّسْتَقِيمٌۭ","Wa ani'buduunii, haadzaa shiraathum-mustaqiim","dan hendaklah kamu menyembah-Ku. Inilah jalan yang lurus."],
["وَلَقَدْ أَضَلَّ مِنكُمْ جِبِلًّۭا كَثِيرًا ۖ أَفَلَمْ تَكُونُوا۟ تَعْقِلُونَ","Wa laqad adhalla minkum jibillan katsiiraa, afalam takuunuu ta'qiluun","Dan sungguh, (setan) itu telah menyesatkan banyak di antara kamu. Maka apakah kamu tidak mengerti?"],
["هَٰذِهِۦ جَهَنَّمُ ٱلَّتِى كُنتُمْ تُوعَدُونَ","Haadzihii jahannamullatii kuntum tuu'aduun","Inilah (neraka) Jahanam yang dahulu diancamkan kepadamu."],
["ٱصْلَوْهَا ٱلْيَوْمَ بِمَا كُنتُمْ تَكْفُرُونَ","Ishlawhal-yawma bimaa kuntum takfuruun","Masuklah ke dalamnya pada hari ini, karena dahulu kamu mengingkarinya.”"],
["ٱلْيَوْمَ نَخْتِمُ عَلَىٰٓ أَفْوَٰهِهِمْ وَتُكَلِّمُنَآ أَيْدِيهِمْ وَتَشْهَدُ أَرْجُلُهُم بِمَا كَانُوا۟ يَكْسِبُونَ","Al-yawma nakhtimu 'alaaa afwaahihim wa tukallimunaaa aydiihim wa tasyhadu arjuluhum bimaa kaanuu yaksibuun","Pada hari ini Kami tutup mulut mereka; tangan mereka akan berkata kepada Kami dan kaki mereka akan memberi kesaksian atas apa yang dahulu mereka usahakan."],
["وَلَوْ نَشَآءُ لَطَمَسْنَا عَلَىٰٓ أَعْيُنِهِمْ فَٱسْتَبَقُوا۟ ٱلصِّرَٰطَ فَأَنَّىٰ يُبْصِرُونَ","Wa law nasyaaa-u lathamasnaa 'alaaa a'yunihim fastabaqush-shiraatha fa-annaa yubshiruun","Dan sekiranya Kami menghendaki, pastilah Kami hapuskan penglihatan mata mereka, sehingga mereka berlomba-lomba (mencari) jalan. Maka bagaimana mereka dapat melihat?"],
["وَلَوْ نَشَآءُ لَمَسَخْنَٰهُمْ عَلَىٰ مَكَانَتِهِمْ فَمَا ٱسْتَطَٰعُوا۟ مُضِيًّۭا وَلَا يَرْجِعُونَ","Wa law nasyaaa-u lamasakhnaahum 'alaa makaanatihim famastathaa'uu mudhiyyaw-wa laa yarji'uun","Dan sekiranya Kami menghendaki, pastilah Kami ubah mereka di tempat mereka berada; sehingga mereka tidak sanggup berjalan lagi dan tidak (pula) sanggup kembali."],
["وَمَن نُّعَمِّرْهُ نُنَكِّسْهُ فِى ٱلْخَلْقِ ۖ أَفَلَا يَعْقِلُونَ","Wa man nu'ammirhu nunakkis-hu fil-khalq, afalaa ya'qiluun","Dan barang siapa Kami panjangkan umurnya, niscaya Kami kembalikan dia pada awal kejadiannya (lemah). Maka apakah mereka tidak mengerti?"],
["وَمَا عَلَّمْنَٰهُ ٱلشِّعْرَ وَمَا يَنۢبَغِى لَهُۥٓ ۚ إِنْ هُوَ إِلَّا ذِكْرٌۭ وَقُرْءَانٌۭ مُّبِينٌۭ","Wa maa 'allamnaahusy-syi'ra wa maa yambaghii lah, in huwa illaa dzikruw-wa qur-aanum-mubiin","Dan Kami tidak mengajarkan syair kepadanya (Muhammad) dan bersyair itu tidaklah pantas baginya. Al-Qur’an itu tidak lain hanyalah pelajaran dan kitab yang jelas,"],
["لِّيُنذِرَ مَن كَانَ حَيًّۭا وَيَحِقَّ ٱلْقَوْلُ عَلَى ٱلْكَٰفِرِينَ","Liyundzira man kaana hayyaw-wa yahiqqal-qawlu 'alal-kaafiriin","agar dia (Muhammad) memberi peringatan kepada orang yang hidup (hatinya) dan agar pastilah (ketetapan azab) terhadap orang-orang kafir."],
["أَوَلَمْ يَرَوْا۟ أَنَّا خَلَقْنَا لَهُم مِّمَّا عَمِلَتْ أَيْدِينَآ أَنْعَٰمًۭا فَهُمْ لَهَا مَٰلِكُونَ","Awa lam yaraw annaa khalaqnaa lahum mimmaa 'amilat aydiinaaa an'aaman fahum lahaa maalikuun","Dan apakah mereka tidak memperhatikan bahwa Kami telah menciptakan hewan ternak untuk mereka, yaitu sebagian dari apa yang telah Kami ciptakan dengan kekuasaan Kami sendiri, lalu mereka menguasainya?"],
["وَذَلَّلْنَٰهَا لَهُمْ فَمِنْهَا رَكُوبُهُمْ وَمِنْهَا يَأْكُلُونَ","Wa dzallalnaahaa lahum faminhaa rakuubuhum wa minhaa ya'kuluun","Dan Kami tundukkan (hewan-hewan itu) untuk mereka; maka sebagiannya menjadi tunggangan mereka dan sebagian (lainnya) mereka makan."],
["وَلَهُمْ فِيهَا مَنَٰفِعُ وَمَشَارِبُ ۖ أَفَلَا يَشْكُرُونَ","Wa lahum fiihaa manaafi'u wa masyaarib, afalaa yasykuruun","Dan mereka memperoleh berbagai manfaat dan minuman darinya. Maka mengapa mereka tidak bersyukur?"],
["وَٱتَّخَذُوا۟ مِن دُونِ ٱللَّهِ ءَالِهَةًۭا لَّعَلَّهُمْ يُنصَرُونَ","Wattakhadzuu min duunillaahi aalihatal-la'allahum yunsharuun","Mereka mengambil sembahan-sembahan selain Allah agar mereka mendapat pertolongan."],
["لَا يَسْتَطِيعُونَ نَصْرَهُمْ وَهُمْ لَهُمْ جُندٌۭ مُّحْضَرُونَ","Laa yastathii'uuna nashrahum wa hum lahum jundum-muhdharuun","(Sembahan-sembahan) itu tidak dapat menolong mereka, padahal (sembahan itu) menjadi tentara yang disiapkan untuk (menjaga) mereka."],
["فَلَا يَحْزُنكَ قَوْلُهُمْ ۘ إِنَّا نَعْلَمُ مَا يُسِرُّونَ وَمَا يُعْلِنُونَ","Falaa yahzunka qawluhum, innaa na'lamu maa yusirruuna wa maa yu'linuun","Maka janganlah ucapan mereka membuatmu bersedih. Sungguh, Kami mengetahui apa yang mereka rahasiakan dan apa yang mereka nyatakan."],
["أَوَلَمْ يَرَ ٱلْإِنسَٰنُ أَنَّا خَلَقْنَٰهُ مِن نُّطْفَةٍۢ فَإِذَا هُوَ خَصِيمٌۭ مُّبِينٌۭ","Awa lam yaral-insaanu annaa khalaqnaahu min nuthfatin fa-idzaa huwa khasiimum-mubiin","Dan tidakkah manusia memperhatikan bahwa Kami menciptakannya dari setetes mani, ternyata dia menjadi penantang yang nyata!"],
["وَضَرَبَ لَنَا مَثَلًۭا وَنَسِىَ خَلْقَهُۥ ۖ قَالَ مَن يُحْىِ ٱلْعِظَٰمَ وَهِىَ رَمِيمٌۭ","Wa dharaba lanaa matsalaw-wa nasiya khalqah, qaala may-yuhyil-'izhaama wa hiya ramiim","Dan dia membuat perumpamaan bagi Kami dan melupakan asal kejadiannya; dia berkata, “Siapakah yang dapat menghidupkan tulang-belulang, padahal sudah hancur luluh?”"],
["قُلْ يُحْيِيهَا ٱلَّذِىٓ أَنشَأَهَآ أَوَّلَ مَرَّةٍۢ ۖ وَهُوَ بِكُلِّ خَلْقٍ عَلِيمٌ","Qul yuhyiihalladziii ansya-ahaaa awwala marrah, wa Huwa bikulli khalqin 'aliim","Katakanlah, “Yang akan menghidupkannya ialah (Allah) yang menciptakannya pertama kali. Dan Dia Maha Mengetahui tentang segala makhluk,"],
["ٱلَّذِى جَعَلَ لَكُم مِّنَ ٱلشَّجَرِ ٱلْأَخْضَرِ نَارًۭا فَإِذَآ أَنتُم مِّنْهُ تُوقِدُونَ","Alladzii ja'ala lakum minasy-syajaril-akhdhari naaran fa-idzaaa antum minhu tuuqiduun","(yaitu) yang menjadikan api untukmu dari kayu yang hijau, maka seketika itu kamu menyalakan (api) dari kayu itu.”"],
["أَوَلَيْسَ ٱلَّذِى خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ بِقَٰدِرٍ عَلَىٰٓ أَن يَخْلُقَ مِثْلَهُم ۚ بَلَىٰ وَهُوَ ٱلْخَلَّٰقُ ٱلْعَلِيمُ","Awa laysalladzii khalaqas-samaawaati wal-ardha biqaadirin 'alaaa ay-yakhluqa mitslahum, balaa wa Huwal-khallaaqul-'aliim","Dan bukankah (Allah) yang menciptakan langit dan bumi mampu menciptakan kembali yang serupa dengan itu? Benar, Dia mampu. Dan Dialah Maha Pencipta, Maha Mengetahui."],
["إِنَّمَآ أَمْرُهُۥٓ إِذَآ أَرَادَ شَيْـًٔا أَن يَقُولَ لَهُۥ كُن فَيَكُونُ","Innamaaa amruhuuu idzaaa araada syay-an ay-yaquula lahuu kun fayakuun","Sesungguhnya urusan-Nya apabila Dia menghendaki sesuatu, Dia hanya berkata kepadanya, “Jadilah!” Maka jadilah sesuatu itu."],
["فَسُبْحَٰنَ ٱلَّذِى بِيَدِهِۦ مَلَكُوتُ كُلِّ شَىْءٍۢ وَإِلَيْهِ تُرْجَعُونَ","Fa-subhaanalladzii biyadihii malakuutu kulli syay-iw-wa ilayhi turja'uun.","Maka Mahasuci (Allah) yang di tangan-Nyalah kekuasaan atas segala sesuatu, dan kepada-Nyalah kamu dikembalikan."]
];

const DEFAULT_ORDER = ["djumi binti panjang","panjang bin risin","risin bin siun","sapiih bin djean","djean bin kuru","naisyah binti h. nidih","penil binti dilan"];

const clean = v => { v=(v||"").trim(); return (v==="-"||v==="—"||v==="–")?"":v; };
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    } else {
      if(c==='"') q=true;
      else if(c===','){ row.push(cell); cell=""; }
      else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=""; }
      else if(c==='\r'){ }
      else cell+=c;
    }
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function mapRows(rows){
  if(rows.length<2) return [];
  const h = rows[0].map(x=>x.trim().toLowerCase());
  const out=[];
  for(let i=1;i<rows.length;i++){
    const o={}; h.forEach((k,idx)=>{ o[k]=(rows[i][idx]||"").trim(); });
    out.push({
      id:o["id"]||"", hubungan:clean(o["hubungan / silsilah"]||o["hubungan"]),
      nama:(o["nama lengkap (bin / binti)"]||o["nama"]||"").trim(), panggilan:clean(o["panggilan / gelar"]||o["panggilan"]),
      lahir:clean(o["tanggal lahir"]), wafat:clean(o["tanggal wafat"]), makam:clean(o["lokasi makam"]),
      foto:clean(o["url foto"]), catatan:clean(o["catatan / kenangan"]), sampul:clean(o["jadikan sampul"]),
      status:clean(o["status"]), urutan:clean(o["urutan doa"]||o["urutan"])
    });
  }
  return out.filter(p=>p.nama);
}
function normalize(list){ return list.map(p=>Object.assign({}, p, {
  hubungan:clean(p.hubungan), panggilan:clean(p.panggilan), lahir:clean(p.lahir), wafat:clean(p.wafat),
  makam:clean(p.makam), foto:clean(p.foto), catatan:clean(p.catatan), sampul:clean(p.sampul),
  status:clean(p.status), urutan:clean(p.urutan)
})); }

const CSV_URLS = [

function setSync(m){ syncMsg = m; store.set("eyasin_syncmsg", m); const e=document.getElementById("syncMsg"); if(e) e.textContent=m; }
function stamp(){ const d=new Date(), p=n=>String(n).padStart(2,"0"); return p(d.getDate())+"/"+p(d.getMonth()+1)+" "+p(d.getHours())+":"+p(d.getMinutes()); }
async function fetchUpdate(){
  if(syncing) return false; syncing = true;
  let why = "";
  try{
    for(const u of CSV_URLS){
      try{
        const res = await fetch(u + (u.indexOf("?")>-1?"&":"?") + "t=" + Date.now(), {cache:"no-store"});
        if(!res.ok){ why = "HTTP "+res.status; continue; }
        const rows = parseCSV(await res.text());
        const head = (rows[0]||[]).join("|").toLowerCase();
        if(head.indexOf("nama lengkap")<0){ why = "tab yang terbit bukan tab data silsilah"; continue; }
        const items = mapRows(rows);
        if(!items.length){ why = "tabel kosong"; continue; }
        familyData = items; store.set("eyasin_family_v2", JSON.stringify(items));
        const bad=items.filter(p=>p.foto && !/^https?:\/\//i.test(p.foto));
        setSync("Tersinkron "+stamp()+" • "+items.length+" data dari Google Sheets"+(bad.length?" • "+bad.length+" foto belum terbaca: kolom URL Foto berisi tulisan (mis. “"+bad[0].foto+"”), bukan alamat link — tempel link aslinya":""));
        renderDynamic(); return true;
      }catch(e){ why = navigator.onLine===false ? "tidak ada internet" : "gagal terhubung ke Google Sheets"; }
    }
  } finally { syncing = false; }
  setSync("Belum tersinkron ("+why+") — memakai data tersimpan");
  return false;
}
function syncNow(btn){

function isWafat(p){
  const st=(p.status||"").toLowerCase();
  if(/hidup|tidak|belum/.test(st)) return false;
  if(/wafat|alm/.test(st)) return true;
  if(p.wafat) return true;
  if(isBB(p)) return true;
  return /^(kakek|nenek|ayah|ibu|bapak|emak|buyut|moyang|datuk|abah)/i.test(p.hubungan||"");
}

function doaList(){
  const idx = p => { const n=parseInt(p.urutan,10); if(n>0) return n;
    const k=DEFAULT_ORDER.indexOf(p.nama.toLowerCase().replace(/\s+/g," ").trim()); return k>=0?k+1:1000; };
  return valid().filter(p=>isBB(p) && !/hidup|tidak|belum/i.test(p.status||"")).map((p,i)=>({p,i})).sort((a,b)=>idx(a.p)-idx(b.p)||a.i-b.i).map(x=>x.p);
}

function photoList(u,sz){
  sz=sz||400;
  u=(u||"").trim(); if(!u || !/^https?:\/\//i.test(u)) return [];
  if(/drive\.google\.com|docs\.google\.com/.test(u)){
    const m=u.match(/\/d\/([\w-]{15,})/)||u.match(/[?&]id=([\w-]{15,})/);
    if(m) return ["https://drive.google.com/thumbnail?id="+m[1]+"&sz=w"+sz,"https://lh3.googleusercontent.com/d/"+m[1]+"=w"+sz,"https://drive.google.com/uc?export=view&id="+m[1],"https://drive.usercontent.google.com/download?id="+m[1]+"&export=view"];
  }
  return [u];
}

function openFoto(img){
  closeFoto();
  const list=(img.dataset.big||"").split("|").filter(Boolean); if(!list.length) return;

  o.innerHTML='<button class="lbx" aria-label="Tutup">&times;</button><img alt="" referrerpolicy="no-referrer"><div class="lbc"><b></b><span></span><div class="lbd"></div></div>';
  const big=o.querySelector("img"); let i=0;
  big.onerror=function(){ i++; if(i<list.length) big.src=list[i]; else { big.src=img.src; } };
  big.src=list[0];
  o.querySelector(".lbc b").textContent=img.dataset.cap||"";

  o.addEventListener("click",e=>{ if(e.target!==big) closeFoto(); });
  document.body.appendChild(o); document.body.style.overflow="hidden";
}

    item("رَبَّنَا اغْفِرْ لَنَا وَلِوَالِدَيْنَا وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ",

/* ============ 5. TAHLIL ============ */
let tasbihCount = 0;
function tasbihBox(label){
  return '<div class="tasbih"><div><div class="lbl">'+(label||"Penghitung Dzikir")+'</div><div class="n" data-tasbih>0</div></div>'+
    '<div class="btns"><button class="plus" onclick="countTasbih()">Hitung +1</button><button class="ghost" onclick="resetTasbih()">Ulang</button></div></div>';
}
function countTasbih(){ tasbihCount++; try{ if(navigator.vibrate) navigator.vibrate(15);}catch(e){} document.querySelectorAll("[data-tasbih]").forEach(e=>e.textContent=tasbihCount); }
function resetTasbih(){ tasbihCount=0; document.querySelectorAll("[data-tasbih]").forEach(e=>e.textContent=0); }

    item("ءَامَنَ ٱلرَّسُولُ بِمَآ أُنزِلَ إِلَيْهِ مِن رَّبِّهِۦ وَٱلْمُؤْمِنُونَ ۚ كُلٌّ ءَامَنَ بِٱللَّهِ وَمَلَٰٓئِكَتِهِۦ وَكُتُبِهِۦ وَرُسُلِهِۦ لَا نُفَرِّقُ بَيْنَ أَحَدٍۢ مِّن رُّسُلِهِۦ ۚ وَقَالُوا۟ سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ ٱلْمَصِيرُ",

    item("وَٱعْفُ عَنَّا وَٱغْفِرْ لَنَا وَٱرْحَمْنَآ","Wa'fu 'annaa waghfir lanaa warhamnaa.","Maafkanlah kami, ampunilah kami, dan rahmatilah kami.","Dibaca 3×",true)+

      "Ya Allah, limpahkanlah shalawat kepada junjungan kami Muhammad; ya Allah, limpahkanlah shalawat dan salam kepadanya. (diulang) Ya Allah, limpahkanlah shalawat kepada junjungan kami Muhammad; wahai Tuhanku, limpahkanlah shalawat, berkah, dan salam kepadanya.","Shalawat")+
    item("سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ وَبِحَمْدِهِ<br>سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ وَبِحَمْدِهِ",
      "Subhaanallaahi wa bihamdihii, Subhaanallaahi wa bihamdih. (Dibaca berulang kali)<br>Subhaanallaahi wa bihamdihii, Subhaanallaahil-'Azhiimi wa bihamdih.",

    item("اللَّهُمَّ صَلِّ عَلَى حَبِيبِكَ سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ<br>اللَّهُمَّ صَلِّ عَلَى حَبِيبِكَ سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ<br>اللَّهُمَّ صَلِّ عَلَى حَبِيبِكَ سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ وَصَحْبِهِ وَبَارِكْ وَسَلِّمْ أَجْمَعِينَ",

    TAAWUDZ()+
    item("الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ، حَمْدَ الشَّاكِرِينَ، حَمْدَ النَّاعِمِينَ، حَمْدًا يُوَافِي نِعَمَهُ وَيُكَافِئُ مَزِيدَهُ",

      "Segala puji bagi Allah, Tuhan semesta alam; pujian orang-orang yang bersyukur, pujian orang-orang yang menikmati karunia-Nya; pujian yang sepadan dengan nikmat-nikmat-Nya dan membalas tambahan karunia-Nya.")+
    item("يَا رَبَّنَا لَكَ الْحَمْدُ وَلَكَ الشُّكْرُ وَلَكَ الْمُلْكُ كَمَا يَنْبَغِي لِجَلَالِ وَجْهِكَ الْكَرِيمِ وَعَظِيمِ سُلْطَانِكَ",

  h += card(2,"Shalawat Penolong (Shalawat Tunjina)",
    item("اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ، صَلَاةً تُنْجِينَا بِهَا مِنْ جَمِيعِ الْأَهْوَالِ وَالْآفَاتِ، وَتَقْضِي لَنَا بِهَا جَمِيعَ الْحَاجَاتِ، وَتُطَهِّرُنَا بِهَا مِنْ جَمِيعِ السَّيِّئَاتِ، وَتَرْفَعُنَا بِهَا عِنْدَكَ أَعْلَى الدَّرَجَاتِ، وَتُبَلِّغُنَا بِهَا أَقْصَى الْغَايَاتِ مِنْ جَمِيعِ الْخَيْرَاتِ فِي الْحَيَاةِ وَبَعْدَ الْمَمَاتِ",

/* ============ DINAMIS ============ */
function renderDynamic(){
  renderCover();
  const t = document.getElementById("tawasulNames"); if(t) t.innerHTML = namesItem("tawasul");
  const d = document.getElementById("doaNames"); if(d) d.innerHTML = namesItem("doa");
}

/* ============ NAVIGASI ============ */
function buildNav(){
  $("#topTabs").innerHTML = TABS.map(t=>'<button data-t="'+t.id+'" onclick="goTab(\''+t.id+'\')">'+t.icon+t.top+'</button>').join("");
  $("#bottomNav").innerHTML = TABS.map(t=>'<button data-t="'+t.id+'" onclick="goTab(\''+t.id+'\')">'+t.icon+'<span>'+t.nav+'</span></button>').join("");
}
function goTab(id, noScroll){
  if(!TABS.some(t=>t.id===id)) id="cover";
  document.querySelectorAll("section.page").forEach(s=>s.classList.toggle("on", s.id==="page-"+id));
  document.querySelectorAll("[data-t]").forEach(b=>b.classList.toggle("on", b.dataset.t===id));
  const on = document.querySelector('#topTabs button.on');
  if(on && on.scrollIntoView){ try{ on.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"}); }catch(e){} }
  store.set("eyasin_tab", id);
  try{ history.replaceState(null,"","#"+id); }catch(e){}
  if(!noScroll) window.scrollTo({top:0,behavior:"auto"});
}
function $(s){ return document.querySelector(s); }

/* ============ AJAKAN PASANG (INSTALL) ============ */
let deferredPrompt = null;
const isStandalone = () => { try{ return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone===true; }catch(e){ return false; } };
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent||"");
const isMobile = /android|iphone|ipad|ipod|mobile/i.test(navigator.userAgent||"");
function instHidden(){ const v=parseInt(store.get("eyasin_inst_off"),10); return !!v && (Date.now()-v) < 7*24*3600*1000; }
function showInstall(){
  if(isStandalone() || instHidden()) return;
  const b=document.getElementById("inst"); if(!b) return;
  if(isIOS && !deferredPrompt) document.getElementById("instTx").textContent="Ketuk tombol Bagikan lalu “Tambah ke Layar Utama”. Lihat langkahnya.";
  b.classList.add("on");
}
function hideInstall(save){ const b=document.getElementById("inst"); if(b) b.classList.remove("on"); if(save) store.set("eyasin_inst_off", String(Date.now())); }
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredPrompt=e; showInstall(); });
window.addEventListener("appinstalled", ()=>{ deferredPrompt=null; hideInstall(true); });
document.addEventListener("click", async ev=>{
  const t=ev.target;
  if(t && t.id==="instNo"){ hideInstall(true); }
  else if(t && t.id==="instGo"){
    if(deferredPrompt){ try{ deferredPrompt.prompt(); await deferredPrompt.userChoice; }catch(e){} deferredPrompt=null; hideInstall(true); }
    else { goTab("pasang"); hideInstall(false); }
  }
});
/* bila peramban tidak mengirim penawaran sendiri (mis. iPhone), tetap tampilkan ajakan di HP */
setTimeout(()=>{ if(!deferredPrompt && isMobile) showInstall(); }, 2500);

/* ============ MULAI ============ */
(function init(){
  applyFont();
  loadCache();
  buildNav();
  renderCover(); renderZiarah(); renderTawasul(); renderYasin(); renderTahlil(); renderDoa(); renderPasang();
  const h = (location.hash||"").replace("#","");
  goTab(TABS.some(t=>t.id===h) ? h : "cover", true);
  fetchUpdate();
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) fetchUpdate(); });
  window.addEventListener("online",()=>fetchUpdate());
  setInterval(()=>{ if(!document.hidden) fetchUpdate(); }, 5*60*1000);
  if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
    window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
  }
})();
</script>
